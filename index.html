
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Plus-Plus｜想像有形</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:"Noto Sans TC",Arial,sans-serif;background:#e5eff2;color:#35465b;overflow:hidden}
    #world{position:fixed;inset:0;z-index:0}
    .top{position:fixed;top:16px;left:16px;right:16px;z-index:5;display:flex;justify-content:space-between;gap:12px;pointer-events:none}
    .pill,.panel,.modalBox,.introBox{background:#ffffffed;border:1px solid #fff;border-radius:22px;box-shadow:0 8px 30px #46546a20}
    .pill{padding:12px 18px;font-weight:700}
    .top>*{pointer-events:auto}
    button{font:inherit;cursor:pointer;border:0;background:#fff;color:#3c5265;border-radius:16px;padding:12px 16px;box-shadow:0 4px 15px #53647718}
    button:disabled{opacity:.5;cursor:wait}
    button:hover:not(:disabled){background:#eef7fb}
    .dock{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:10px;background:#ffffffdf;padding:10px;border-radius:24px;box-shadow:0 10px 30px #40506625}
    .dock button{font-size:22px;min-width:55px}
    .dock button.listening{background:#ffc4cc}
    .panel{position:fixed;right:16px;top:80px;bottom:100px;width:min(350px,calc(100vw - 32px));z-index:8;padding:20px;overflow:auto;display:none}
    .panel.open{display:block}
    .panel h2{font-size:18px;margin:0 0 14px}
    .panel button{width:100%;text-align:left;margin:5px 0}
    .heroBtn.active{background:#d7ecf9}
    #status{white-space:pre-wrap;font-size:12px;line-height:1.7;background:#eef5f8;padding:12px;border-radius:12px;overflow-wrap:anywhere}
    #heroList{display:flex;flex-direction:column;gap:6px}
    #message{position:fixed;z-index:9;left:50%;top:90px;transform:translateX(-50%);max-width:min(650px,90vw);background:#ffffffed;border-radius:18px;padding:14px 22px;text-align:center;box-shadow:0 6px 25px #35475c24}
    #message[hidden],#loading[hidden]{display:none}
    .modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#1b30468c;padding:16px}
    .modal.open{display:flex}
    .modalBox{padding:20px;width:min(580px,100%);text-align:center}
    video{width:100%;max-height:58vh;object-fit:contain;background:#1e293b;border-radius:14px}
    .modalActions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
    .intro{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e3f3f7,#fce8e3);padding:20px}
    .introBox{max-width:520px;padding:38px;text-align:center}
    .introBox h1{font-size:36px}
    .primary{background:#bde5ed;font-weight:700}
    iframe#bridge{position:absolute;width:0;height:0;border:0;opacity:0;pointer-events:none}
    @media(max-width:600px){.dock{gap:4px;padding:6px}.dock button{min-width:44px;padding:10px;font-size:18px}.top{top:8px;left:8px;right:8px}.pill{font-size:13px;padding:10px}}
  </style>
</head>
<body>
  <div id="world"></div>

  <div class="top">
    <div class="pill" id="worldTitle">Plus-Plus｜想像有形</div>
    <button id="panelToggle">☰ 工作台</button>
  </div>

  <div id="message" hidden>
    <span id="loading" hidden>⏳ </span>
    <span id="messageText"></span>
  </div>

  <div class="dock">
    <button id="photo" title="拍照">📷</button>
    <button id="mic" title="語音">🎤</button>
    <button id="sound" title="聲音">🔊</button>
    <button id="more" title="工作台">🧩</button>
    <button id="fullscreen" title="全螢幕">⛶</button>
  </div>

  <aside class="panel" id="panel">
    <h2>🧩 Plus-Plus 創作工作台</h2>
    <button id="test">🔌 測試 AI 連線</button>
    <button id="upload">🖼️ 選擇積木照片</button>
    <button id="retry">🌈 重新生成世界</button>
    <button id="clear">🗑️ 清空世界</button>
    <h2 style="margin-top:20px">角色</h2>
    <div id="heroList">尚未加入角色</div>
    <h2 style="margin-top:20px">系統狀態</h2>
    <div id="status">準備中</div>
  </aside>

  <div class="modal" id="cameraModal">
    <div class="modalBox">
      <h2>📷 拍攝你的 Plus-Plus 作品</h2>
      <video id="video" autoplay muted playsinline></video>
      <div class="modalActions">
        <button id="capture" class="primary">拍攝作品</button>
        <button id="closeCamera">關閉</button>
        <button id="upload">選擇照片</button>
      </div>
    </div>
  </div>

  <div class="intro" id="intro">
    <div class="introBox">
      <h1>🧩 想像有形</h1>
      <p>拼出自己的 Plus-Plus 作品，讓積木走進想像世界。</p>
      <p>拍照、探索，再用聲音為作品增加新的可能。</p>
      <button class="primary" id="begin">開始創作 ✨</button>
    </div>
  </div>

  <input id="file" type="file" accept="image/*" hidden>

  <!-- 一評同樣的 iframe Bridge -->
  <iframe id="bridge" title="GAS AI Bridge"></iframe>

  <script src="sketch.js"></script>
  <script src="ai-director.js"></script>
</body>
</html>
