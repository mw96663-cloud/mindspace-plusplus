
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Plus-Plus｜想像有形</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>

  <style>
    :root {
      --ink: #435267;
      --muted: #718092;
      --paper: #f8f9f7;
      --white: #ffffff;
      --line: #e3e8ed;
      --mint: #d8efe7;
      --peach: #ffe4d5;
      --lavender: #e7e1fb;
      --yellow: #fff1c7;
      --shadow: 0 12px 38px rgba(49, 70, 88, .12);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        system-ui,
        sans-serif;
      color: var(--ink);
      background: #eaf3f6;
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    #worldHost {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
    }

    #worldHost canvas {
      display: block;
    }

    .topbar {
      position: fixed;
      z-index: 20;
      left: 22px;
      right: 22px;
      top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }

    .brand {
      pointer-events: auto;
      padding: 13px 18px;
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .brand h1 {
      font-size: 18px;
      margin: 0;
      letter-spacing: 1px;
    }

    .brand p {
      margin: 5px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .topActions {
      display: flex;
      gap: 9px;
      pointer-events: auto;
    }

    .topButton {
      width: 45px;
      height: 45px;
      border: 1px solid rgba(255,255,255,.9);
      background: rgba(255,255,255,.88);
      border-radius: 16px;
      box-shadow: var(--shadow);
      font-size: 19px;
    }

    #notice {
      position: fixed;
      z-index: 30;
      left: 50%;
      top: 100px;
      transform: translateX(-50%);
      width: min(490px, calc(100vw - 36px));
      padding: 14px 18px;
      text-align: center;
      border-radius: 20px;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      font-size: 15px;
      line-height: 1.6;
      transition: opacity .25s;
    }

    #notice[hidden] {
      display: none;
    }

    .progress {
      height: 5px;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 99px;
      background: #e8edf1;
    }

    .progress > div {
      height: 100%;
      width: 35%;
      background: #91cdbb;
      border-radius: 99px;
      animation: progressMove 1.5s ease-in-out infinite alternate;
    }

    @keyframes progressMove {
      from { transform: translateX(-10%); }
      to { transform: translateX(220%); }
    }

    .dock {
      position: fixed;
      z-index: 25;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 13px;
      padding: 12px 15px;
      background: rgba(255,255,255,.7);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 100px;
      box-shadow: var(--shadow);
    }

    .bubbleButton {
      width: 57px;
      height: 57px;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 23px;
      transition: transform .18s, filter .18s;
    }

    .bubbleButton:hover {
      transform: translateY(-4px);
      filter: brightness(1.03);
    }

    .bubbleButton:disabled {
      opacity: .45;
      cursor: wait;
    }

    #photoBtn { background: var(--peach); }
    #voiceBtn { background: var(--mint); }
    #soundBtn { background: var(--yellow); }
    #moreBtn { background: var(--lavender); }

    .bubbleButton.listening {
      animation: listenPulse 1s infinite alternate;
    }

    @keyframes listenPulse {
      from { box-shadow: 0 0 0 0 rgba(84,183,151,.3); }
      to { box-shadow: 0 0 0 13px rgba(84,183,151,0); }
    }

    .panel {
      position: fixed;
      z-index: 35;
      top: 78px;
      right: 20px;
      bottom: 110px;
      width: min(345px, calc(100vw - 40px));
      padding: 22px;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(20px);
      border: 1px solid white;
      border-radius: 25px;
      box-shadow: var(--shadow);
      overflow: auto;
      display: none;
    }

    .panel.open {
      display: block;
    }

    .panel h2 {
      font-size: 19px;
      margin: 0 0 18px;
    }

    .panel h3 {
      font-size: 14px;
      margin: 22px 0 8px;
    }

    .smallText {
      font-size: 13px;
      line-height: 1.7;
      color: var(--muted);
    }

    .panelButton {
      width: 100%;
      margin: 5px 0;
      padding: 12px 15px;
      text-align: left;
      border-radius: 13px;
      border: 1px solid var(--line);
      background: #f8fafb;
      color: var(--ink);
    }

    #characterList {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .characterRow {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      background: white;
      cursor: pointer;
    }

    .characterRow.active {
      background: #e9f6f0;
      border-color: #a5d9c6;
    }

    .statusBox {
      white-space: pre-wrap;
      word-break: break-word;
      padding: 12px;
      background: #f4f7f8;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.7;
    }

    .cameraModal {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(32,48,61,.72);
    }

    .cameraModal.open {
      display: flex;
    }

    .cameraCard {
      width: min(680px, 100%);
      padding: 17px;
      background: white;
      border-radius: 24px;
    }

    .cameraCard h2 {
      font-size: 19px;
      margin: 2px 0 12px;
    }

    #cameraVideo {
      display: block;
      width: 100%;
      max-height: 58vh;
      aspect-ratio: 4 / 3;
      background: #dce4e9;
      object-fit: contain;
      border-radius: 16px;
      transform: scaleX(-1);
    }

    .cameraActions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .actionButton {
      flex: 1;
      min-width: 105px;
      padding: 13px 15px;
      border: 0;
      border-radius: 13px;
      background: #e9f1ee;
      color: #40564f;
      font-weight: 600;
    }

    .actionButton.primary {
      background: #a9dfcb;
    }

    .actionButton.secondary {
      background: #eef0f3;
    }

    #intro {
      position: fixed;
      z-index: 50;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background:
        radial-gradient(circle at 20% 20%, #ffe6d9, transparent 40%),
        radial-gradient(circle at 80% 70%, #d8e9ff, transparent 42%),
        #f3f8f5;
    }

    .introCard {
      width: min(560px, 100%);
      padding: 45px 30px;
      text-align: center;
      border-radius: 30px;
      background: rgba(255,255,255,.82);
      box-shadow: var(--shadow);
    }

    .introCard h1 {
      margin: 0 0 15px;
      font-size: clamp(29px, 5vw, 44px);
    }

    .introCard p {
      color: var(--muted);
      line-height: 1.9;
    }

    #beginBtn {
      margin-top: 16px;
      padding: 16px 40px;
      border: 0;
      border-radius: 100px;
      background: #a8dfc8;
      font-weight: 700;
      font-size: 17px;
      color: #355548;
    }

    #bridgeFrame {
      display: none;
    }

    @media (max-width: 600px) {
      .topbar {
        left: 12px;
        right: 12px;
        top: 12px;
      }

      .brand {
        padding: 10px 12px;
      }

      .brand h1 { font-size: 15px; }
      .brand p { font-size: 10px; }

      .topButton {
        width: 40px;
        height: 40px;
      }

      #notice {
        top: 78px;
      }

      .dock {
        bottom: 15px;
        gap: 9px;
        padding: 10px;
      }

      .bubbleButton {
        width: 52px;
        height: 52px;
      }

      .panel {
        top: 65px;
        right: 12px;
        bottom: 95px;
      }
    }
  </style>
</head>

<body>

  <div id="worldHost"></div>

  <header class="topbar">
    <div class="brand">
      <h1 id="worldTitle">Plus-Plus｜想像有形</h1>
      <p>把手中的創作，變成會動的世界</p>
    </div>

    <div class="topActions">
      <button
        id="fullscreenBtn"
        class="topButton"
        title="全螢幕"
        aria-label="全螢幕"
      >⛶</button>

      <button
        id="panelBtn"
        class="topButton"
        title="工作台"
        aria-label="開啟工作台"
      >☰</button>
    </div>
  </header>

  <div id="notice" hidden>
    <div id="noticeText">準備好了嗎？</div>
    <div id="noticeProgress" class="progress" hidden>
      <div></div>
    </div>
  </div>

  <nav class="dock" aria-label="互動操作">
    <button
      id="photoBtn"
      class="bubbleButton"
      title="拍攝積木作品"
      aria-label="拍攝積木作品"
    >📷</button>

    <button
      id="voiceBtn"
      class="bubbleButton"
      title="跟世界說話"
      aria-label="跟世界說話"
    >🎤</button>

    <button
      id="soundBtn"
      class="bubbleButton"
      title="開啟或關閉語音"
      aria-label="開啟或關閉語音"
    >🔊</button>

    <button
      id="moreBtn"
      class="bubbleButton"
      title="更多設定"
      aria-label="更多設定"
    >✨</button>
  </nav>

  <aside id="panel" class="panel">
    <h2>我的想像工作台</h2>

    <p class="smallText">
      拼出喜歡的 Plus-Plus 作品，
      拍照後讓它進入數位世界。
      也可以直接用說話改變世界。
    </p>

    <button id="testBtn" class="panelButton">
      🔌 測試 AI 連線
    </button>

    <button id="retryBtn" class="panelButton">
      🔄 重新生成目前的世界
    </button>

    <button id="clearBtn" class="panelButton">
      🧹 清空世界重新創作
    </button>

    <h3>已創造的角色</h3>
    <div id="characterList" class="smallText">
      尚未加入角色
    </div>

    <h3>系統狀態</h3>
    <div id="statusBox" class="statusBox">
      尚未連線
    </div>

    <h3>使用提示</h3>
    <p class="smallText">
      建議將積木作品放在單色背景上，
      讓 AI 更容易保留原本的積木輪廓。
      語音功能建議使用 Chrome 或 Edge。
    </p>
  </aside>

  <div id="cameraModal" class="cameraModal">
    <div class="cameraCard">
      <h2>📷 拍攝你的 Plus-Plus 作品</h2>

      <video
        id="cameraVideo"
        autoplay
        playsinline
        muted
      ></video>

      <div class="cameraActions">
        <button id="captureBtn"
                class="actionButton primary">
          拍照
        </button>

        <button id="uploadBtn"
                class="actionButton">
          選擇照片
        </button>

        <button id="cameraCloseBtn"
                class="actionButton secondary">
          返回
        </button>
      </div>

      <input
        id="photoInput"
        type="file"
        accept="image/*"
        hidden
      >
    </div>
  </div>

  <section id="intro">
    <div class="introCard">
      <div style="font-size:52px;margin-bottom:12px">
        🌈 🧩 ✨
      </div>

      <h1>Plus-Plus 想像有形</h1>

      <p>
        用積木拼出你的想像。<br>
        拍一張照片，讓作品走進會動的世界。<br>
        你也可以跟它說話，一起創造故事。
      </p>

      <button id="beginBtn">開始創作</button>
    </div>
  </section>

  <iframe
    id="bridgeFrame"
    title="AI Bridge"
    aria-hidden="true"
  ></iframe>

  <script src="ai-director.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
