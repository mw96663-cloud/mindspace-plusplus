
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mindspace Plus-Plus｜想像有形</title>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>

  <style>
    :root {
      --ink: #273345;
      --muted: #68768b;
      --blue: #6d90f5;
      --pink: #f39ac5;
      --paper: #f7f8ff;
      --line: #dce3f1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family:
        "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 13px;
      padding: 11px 16px;
      background: var(--blue);
      color: white;
      font-weight: 700;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    button.secondary {
      color: var(--ink);
      background: #e8edfb;
    }

    button.pink {
      background: var(--pink);
    }

    button.ghost {
      color: var(--ink);
      background: white;
      border: 1px solid var(--line);
    }

    header {
      padding: 18px 24px;
      background: white;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    h1 {
      font-size: 22px;
      margin: 0;
    }

    h2 {
      font-size: 17px;
      margin: 0 0 12px;
    }

    p {
      line-height: 1.65;
    }

    .small {
      font-size: 12px;
      color: var(--muted);
    }

    .layout {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr) 300px;
      gap: 16px;
      padding: 16px;
      max-width: 1800px;
      margin: auto;
    }

    .panel {
      background: white;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      min-width: 0;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    input, textarea, select {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      color: var(--ink);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    #world {
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: 16px;
      overflow: hidden;
      background: #d8ecff;
      position: relative;
    }

    #world canvas {
      display: block;
    }

    .item {
      border: 1px solid var(--line);
      padding: 10px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .item.selected {
      border-color: var(--blue);
      background: #edf2ff;
    }

    .item img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    #log {
      max-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .message {
      background: #f3f5fb;
      padding: 10px 12px;
      border-radius: 13px;
      line-height: 1.6;
      font-size: 14px;
    }

    .message.user {
      background: #e9efff;
    }

    #status {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(26, 36, 60, .68);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      width: min(700px, 100%);
      max-height: 95vh;
      overflow-y: auto;
      padding: 20px;
      border-radius: 22px;
      background: white;
    }

    video, #photoPreview {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      background: #202638;
      border-radius: 14px;
    }

    #photoPreview {
      display: none;
    }

    #classification {
      display: none;
      background: #f1f5ff;
      padding: 14px;
      border-radius: 14px;
    }

    #classification img {
      display: block;
      max-height: 160px;
      max-width: 100%;
      margin: 8px auto;
      object-fit: contain;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 1100px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .center {
        order: -1;
      }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>✦ Mindspace Plus-Plus</h1>
      <div class="small">
        想像有形｜讓實體創作進入數位心智世界
      </div>
    </div>

    <div class="row">
      <button id="openCamera">📷 新增積木作品</button>
      <button id="saveWorld" class="secondary">儲存世界</button>
      <button id="loadWorld" class="ghost">讀取世界</button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel stack">
      <section>
        <h2>我的創作</h2>
        <div class="small">
          角色與環境可以持續加入同一個世界。
        </div>
      </section>

      <section>
        <h2>角色</h2>
        <div id="characterList"></div>
      </section>

      <section>
        <h2>環境</h2>
        <div id="environmentList"></div>
      </section>

      <section>
        <h2>選取作品</h2>
        <div id="selectedInfo" class="small">
          尚未選擇作品
        </div>
        <div class="row" style="margin-top:10px">
          <button id="removeSelected" class="ghost">
            移除選取作品
          </button>
        </div>
      </section>
    </aside>

    <section class="panel center stack">
      <div class="row" style="justify-content:space-between">
        <h2>共同的數位想像世界</h2>
        <span id="worldCount" class="small">0 個作品</span>
      </div>

      <div id="world"></div>

      <div class="small">
        點擊世界中的作品可選取；拖曳可移動位置。
        新作品不會清空原本的世界。
      </div>

      <div class="row">
        <button id="cameraShortcut" class="pink">
          ＋ 創造新作品
        </button>
        <button id="resetView" class="secondary">
          重設畫面位置
        </button>
      </div>

      <div id="status">正在連接 AI……</div>
    </section>

    <aside class="panel stack">
      <section>
        <h2>和想像世界說話</h2>
        <p class="small">
          自由描述任何角色、配件、能力、環境或故事事件。
          不需要使用指定指令。
        </p>
      </section>

      <div id="log"></div>

      <textarea id="prompt"
        placeholder="例如：讓我的積木龍吐出會變成星星的彩虹泡泡，城堡碰到星星後長出翅膀……"></textarea>

      <div class="row">
        <button id="send">✨ 讓想像發生</button>
        <button id="mic" class="pink">🎙️ 說話</button>
      </div>

      <div class="row">
        <label class="small">
          <input id="voiceReply" type="checkbox" checked
            style="width:auto">
          AI 語音回應
        </label>
      </div>

      <div class="small">
        AI 是創作助手，孩子可以隨時修改、
        推翻或延續 AI 生成的內容。
      </div>
    </aside>
  </main>

  <div id="cameraModal" class="modal">
    <div class="modal-content stack">
      <div class="row" style="justify-content:space-between">
        <h2>拍攝 Plus-Plus 積木作品</h2>
        <button id="closeCamera" class="ghost">✕</button>
      </div>

      <video id="cameraVideo" autoplay playsinline muted></video>
      <img id="photoPreview" alt="拍攝預覽">

      <textarea id="photoDescription"
        placeholder="孩子可以描述這是什麼，例如：這是一座會飛的城堡。也可以留白，讓 AI 先觀察。"></textarea>

      <div class="row">
        <button id="takePhoto">📸 拍攝</button>
        <button id="retakePhoto" class="secondary">
          重拍
        </button>
        <button id="removeBg">✨ AI 去背</button>
      </div>

      <div id="cameraStatus" class="small">
        請將積木作品放在鏡頭中央。
      </div>
    </div>
  </div>

  <section id="classification" class="panel"
    style="position:fixed;right:20px;bottom:20px;
           width:min(370px,calc(100vw - 40px));
           z-index:80;box-shadow:0 15px 45px #26345030">

    <h2>這件作品是什麼？</h2>

    <img id="candidateImage" alt="去背完成的作品">

    <p id="aiSuggestion" class="small">
      AI 正在辨識……
    </p>

    <label for="candidateName">作品名稱</label>
    <input id="candidateName" placeholder="幫作品取名字">

    <label for="candidateType">作品類型（由你決定）</label>
    <select id="candidateType">
      <option value="character">角色 Character</option>
      <option value="environment">環境 Environment</option>
    </select>

    <div class="row" style="margin-top:12px">
      <button id="confirmCandidate">加入世界</button>
      <button id="cancelCandidate" class="ghost">取消</button>
    </div>
  </section>

  <iframe id="aiBridge" title="AI Bridge"
    style="display:none"></iframe>

  <script src="sketch.js"></script>
  <script src="ai-director.js"></script>
</body>
</html>
