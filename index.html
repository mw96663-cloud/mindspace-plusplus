
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Mindspace Plus-Plus｜想像有形</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    :root {
      --ink: #27334b;
      --panel: rgba(255,255,255,.96);
      --accent: #ffcb58;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", Arial, sans-serif;
      color: var(--ink);
      overflow: hidden;
      background: #123b67;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    #scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: linear-gradient(
        180deg, #70c8e8, #165487 75%, #103b69
      );
    }

    #scene canvas {
      display: block;
    }

    #speechBubble {
      position: fixed;
      z-index: 15;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      max-width: min(580px, 82vw);
      padding: 13px 22px;
      border-radius: 24px;
      background: rgba(255,255,255,.9);
      box-shadow: 0 5px 24px #0002;
      text-align: center;
      pointer-events: none;
    }

    #floatingControls {
      position: fixed;
      right: 20px;
      bottom: 24px;
      z-index: 25;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .floatButton {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      font-size: 25px;
      background: white;
      box-shadow: 0 5px 20px #0003;
    }

    .floatButton.primary {
      background: var(--accent);
    }

    #sidebar {
      position: fixed;
      z-index: 40;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(410px, 100vw);
      display: flex;
      flex-direction: column;
      background: var(--panel);
      box-shadow: -8px 0 35px #0002;
      transform: translateX(105%);
      transition: transform .25s ease;
    }

    #sidebar.is-open {
      transform: translateX(0);
    }

    body:has(#sidebar.is-open) #floatingControls {
      display: none;
    }

    .sidebarHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-bottom: 1px solid #e5e8ed;
    }

    .sidebarHeader h1 {
      margin: 0;
      font-size: 20px;
    }

    .sidebarBody {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    section {
      margin-bottom: 23px;
    }

    section h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .muted {
      color: #718096;
      font-size: 13px;
      line-height: 1.6;
    }

    .field {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d9dfe8;
      border-radius: 12px;
      background: white;
      margin: 6px 0;
    }

    .action {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 13px;
      background: #e8f0fa;
      color: var(--ink);
      font-weight: 600;
    }

    .action.primary {
      background: var(--accent);
    }

    .action.dark {
      background: #27334b;
      color: white;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row > * {
      flex: 1;
      min-width: 0;
    }

    #status {
      padding: 12px;
      border-radius: 12px;
      background: #f1f4f8;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #aiTestResult {
      padding: 12px;
      margin-top: 8px;
      background: #f8fafc;
      border-radius: 12px;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 230px;
      overflow-y: auto;
    }

    .modal {
      position: fixed;
      z-index: 80;
      inset: 0;
      background: rgba(8,20,42,.7);
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .modalCard {
      width: min(600px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      padding: 22px;
      border-radius: 24px;
      background: white;
    }

    video, #editCanvas {
      width: 100%;
      max-height: 50vh;
      object-fit: contain;
      background: #e9edf2;
      border-radius: 14px;
    }

    #classificationPreview {
      display: block;
      width: 190px;
      height: 190px;
      object-fit: contain;
      margin: auto;
      background: #edf2f6;
      border-radius: 14px;
    }

    #chatLog {
      height: 180px;
      overflow-y: auto;
      padding: 8px;
      background: #f7f9fc;
      border-radius: 12px;
    }

    #bridgeFrame {
      position: absolute;
      width: 0;
      height: 0;
      border: 0;
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      #speechBubble { font-size: 13px; }
      #floatingControls { right: 12px; bottom: 14px; }
      .floatButton { width: 52px; height: 52px; }
    }
  </style>
</head>

<body>

  <!-- STEP 03～05｜持續存在的數位世界 -->
  <main id="scene"></main>

  <div id="speechBubble">
    歡迎來到 Mindspace！你的想像可以成為這個世界的一部分。
  </div>

  <!-- 浮動操作 -->
  <nav id="floatingControls">
    <button id="bubbleCamera"
            class="floatButton"
            title="拍攝積木"
            disabled>📷</button>

    <button id="bubbleMic"
            class="floatButton"
            title="語音創作"
            disabled>🎙️</button>

    <button id="bubbleWorkbench"
            class="floatButton primary"
            title="開啟工作台">🧺</button>
  </nav>

  <!-- 可收闔工作台 -->
  <aside id="sidebar">
    <header class="sidebarHeader">
      <h1>🧺 創作工作台</h1>
      <button id="closeWorkbench"
              class="floatButton"
              style="width:38px;height:38px;font-size:20px">
        ×
      </button>
    </header>

    <div class="sidebarBody">

      <section>
        <h2>🔌 AI 真實連線</h2>
        <div id="status">尚未測試 AI 連線</div>

        <button id="testBridge"
                class="action primary">
          測試 OpenAI 真實連線
        </button>

        <div id="aiTestResult">
          等待測試結果。
        </div>
      </section>

      <section>
        <h2>STEP 01｜自由創作</h2>
        <p class="muted">
          使用 Plus-Plus 積木拼出角色、建築、地形，
          或任何你想像中的作品。
        </p>
      </section>

      <section>
        <h2>STEP 02｜拍照與 AI 去背</h2>
        <button id="openCamera"
                class="action primary"
                disabled>📷 拍攝作品</button>

        <button id="uploadPhoto"
                class="action"
                disabled>上傳照片</button>

        <input id="photoFile"
               type="file"
               accept="image/*"
               class="hidden">
      </section>

      <section>
        <h2>STEP 03～05｜共同世界</h2>
        <p class="muted">
          去背後的原始積木會立即進入世界。
          角色與環境可以持續共存。
        </p>

        <select id="selectedHero" class="field">
          <option value="">尚無作品</option>
        </select>

        <div id="heroList"></div>

        <textarea id="creationDescription"
                  class="field"
                  rows="3"
                  placeholder="描述你的作品……"></textarea>

        <button id="generateCreationWorld"
                class="action"
                disabled>生成想像世界</button>
      </section>

      <section>
        <h2>STEP 06｜語音自由創造</h2>

        <div id="chatLog"></div>

        <textarea id="chatInput"
                  class="field"
                  rows="2"
                  placeholder="讓角色變身、發動技能、創造故事……"
                  disabled></textarea>

        <div class="row">
          <button id="micButton"
                  class="action"
                  disabled>🎙️ 說話</button>

          <button id="sendButton"
                  class="action primary"
                  disabled>送出</button>
        </div>

        <input id="transformInput"
               class="field"
               placeholder="例如：長出彩虹翅膀"
               disabled>

        <div class="row">
          <button id="transformButton"
                  class="action"
                  disabled>變身</button>

          <button id="skillButton"
                  class="action"
                  disabled>技能</button>
        </div>

        <div class="row">
          <button id="voiceButton"
                  class="action"
                  disabled>AI 語音</button>

          <button id="stopVoice"
                  class="action"
                  disabled>停止播放</button>
        </div>

        <label for="aiVoiceVolume" class="muted">
          AI 音量
          <span id="aiVoiceVolumeValue">60%</span>
        </label>

        <input id="aiVoiceVolume"
               type="range"
               min="0"
               max="100"
               value="60"
               style="width:100%"
               disabled>
      </section>

    </div>
  </aside>

  <!-- 拍照視窗：後續接入攝影機 -->
  <div id="cameraModal" class="modal hidden">
    <div class="modalCard">
      <h2>📷 拍攝 Plus-Plus 積木</h2>
      <video id="cameraVideo"
             autoplay
             muted
             playsinline></video>
      <p id="cameraMessage" class="muted"></p>
      <button id="captureButton" class="action primary">
        拍照
      </button>
      <button id="switchCamera" class="action">
        切換鏡頭
      </button>
      <button id="closeCamera" class="action">
        關閉
      </button>
    </div>
  </div>

  <!-- 去背編輯視窗：後續接入 AI 去背 -->
  <div id="editorModal" class="modal hidden">
    <div class="modalCard">
      <h2>✨ AI 去背</h2>
      <canvas id="editCanvas"></canvas>

      <button id="removeBgAI" class="action primary">
        AI 去背
      </button>

      <button id="saveEditor" class="action">
        確認作品
      </button>

      <button id="closeEditor" class="action">
        關閉
      </button>
    </div>
  </div>

  <!-- AI 分類：孩子保留最終決定權 -->
  <div id="classificationModal" class="modal hidden">
    <div class="modalCard">
      <h2>✨ 這是什麼作品？</h2>

      <img id="classificationPreview"
           alt="孩子的積木作品">

      <p id="classificationMessage" class="muted">
        AI 正在理解你的作品……
      </p>

      <textarea id="classificationDescription"
                class="field"
                rows="3"
                placeholder="告訴 AI，你創造了什麼？"></textarea>

      <div class="row">
        <button id="classifyCharacter" class="action">
          🐠 角色
        </button>

        <button id="classifyEnvironment" class="action">
          🌳 環境
        </button>
      </div>

      <button id="confirmClassification"
              class="action primary">
        確認
      </button>
    </div>
  </div>

  <!-- Google Apps Script Bridge -->
  <iframe id="bridgeFrame"
          title="Mindspace AI Bridge"></iframe>

  <script>
    "use strict";

    /*
      目前只啟用：
      1. 工作台開關
      2. Bridge 通訊
      3. OpenAI 真實連線測試

      其餘按鈕等待後續程式接入，
      不使用假資料模擬成功。
    */

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbwUooMD69_NMBhTzxf0Os_D6BEGb3QsGyhXpTGv09emRcG_4du219K4qO_FggY1vnLHOg/exec";

    const APP = "mindspace-v2";

    const $ = id =>
      document.getElementById(id);

    const token =
      crypto.randomUUID();

    const pending =
      new Map();

    let bridgeWindow = null;
    let bridgeOrigin = "";
    let bridgeReady = false;

    function setStatus(message) {
      $("status").textContent = message;
    }

    function setResult(message) {
      $("aiTestResult").textContent = message;
    }

    /*
      可收闔工作台
    */

    $("bubbleWorkbench").onclick = () => {
      $("sidebar").classList.add("is-open");
    };

    $("closeWorkbench").onclick = () => {
      $("sidebar").classList.remove("is-open");
    };

    /*
      Google Apps Script HTML Service
      可能使用巢狀 iframe。

      因此從 ready 訊息取得真正的
      event.source，後續將請求送回
      同一個視窗。
    */

    window.addEventListener("message", event => {

      if (
        !/^https:\/\/script\.google(?:usercontent)?\.com$/
          .test(event.origin)
      ) {
        return;
      }

      const message =
        event.data || {};

      if (
        message.app !== APP ||
        message.token !== token
      ) {
        return;
      }

      if (
        message.kind === "ready"
      ) {
        bridgeWindow = event.source;
        bridgeOrigin = event.origin;
        bridgeReady = true;

        setStatus(
          "Bridge 已載入，尚未驗證 OpenAI"
        );

        return;
      }

      if (
        message.kind !== "response"
      ) {
        return;
      }

      if (
        event.source !== bridgeWindow
      ) {
        return;
      }

      const job =
        pending.get(message.id);

      if (!job) return;

      clearTimeout(job.timer);
      pending.delete(message.id);

      if (message.ok) {
        job.resolve(message.result);
      } else {
        job.reject(
          new Error(
            message.error ||
            "AI 後端回應失敗"
          )
        );
      }

    });

    function requestAI(type, data = {}) {
      if (!bridgeReady || !bridgeWindow) {
        return Promise.reject(
          new Error("Bridge 尚未連線")
        );
      }

      const id =
        crypto.randomUUID();

      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          pending.delete(id);
          reject(new Error("AI 請求逾時"));
        }, 90000);

        pending.set(id, {
          resolve,
          reject,
          timer
        });

        bridgeWindow.postMessage({
          app: APP,
          token,
          kind: "request",
          id,
          type,
          data
        }, bridgeOrigin);
      });
    }

    /*
      真正呼叫 OpenAI。
      不使用固定測試結果。
    */

    $("testBridge").onclick = async () => {
      const button = $("testBridge");
      button.disabled = true;

      setStatus("正在測試 OpenAI……");
      setResult("等待後端回應");

      try {
        const ping =
          await requestAI("ping");

        const result =
          await requestAI("checkAI");

        if (
          !ping.alive ||
          result.connected !== true ||
          result.verified !== true
        ) {
          throw new Error(
            "AI 未通過完整驗證"
          );
        }

        setStatus(
          "✅ OpenAI 真實連線成功"
        );

        setResult(
          "模型：" + result.model + "\n" +
          "請求 ID：" + result.responseId + "\n" +
          "驗證碼：" + result.challenge + "\n" +
          "AI 回答：" + result.text + "\n" +
          "測試時間：" + result.checkedAt
        );

      } catch (error) {
        setStatus(
          "❌ AI 連線失敗"
        );

        setResult(
          error.message
        );

      } finally {
        button.disabled = false;
      }
    };

    /*
      初始化 Bridge。
      必須在 message listener 安裝後
      才設定 iframe.src。
    */

    const bridgeURL =
      new URL(GAS_URL);

    bridgeURL.searchParams.set(
      "bridgeToken",
      token
    );

    bridgeURL.searchParams.set(
      "parentOrigin",
      location.origin
    );

    $("bridgeFrame").src =
      bridgeURL.toString();

    setStatus(
      "正在載入 Google Apps Script Bridge……"
    );
  </script>

</body>
</html>
