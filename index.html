
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plus-Plus｜我的想像世界</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<style>
:root {
  --ink:#344a48;
  --paper:#fffdf9;
  --mint:#d8efe8;
  --pink:#f7dce7;
  --blue:#dceafb;
  --cream:#f7e8cb;
}
* {box-sizing:border-box}
html,body {margin:0;width:100%;height:100%;overflow:hidden;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
button,input,textarea {font:inherit}
button {border:0;cursor:pointer;color:var(--ink);font-weight:700}
button:disabled {opacity:.5;cursor:wait}
.hidden {display:none!important}
#app {position:relative;width:100%;height:100dvh;overflow:hidden;background:#cce8eb}
#world {position:absolute;inset:0;overflow:hidden}
#scene {position:absolute;inset:0}
#scene canvas {display:block}
#bridgeFrame {display:none}
#topbar {
  position:absolute;top:12px;right:12px;z-index:25;
  display:flex;gap:9px
}
.topbtn {
  width:46px;height:46px;border-radius:50%;
  background:#ffffffdf;box-shadow:0 3px 12px #0002;
  font-size:20px
}
#title {
  position:absolute;top:14px;left:14px;z-index:10;
  background:#fffffff0;border-radius:20px;padding:10px 15px;
  font-weight:800;font-size:15px;max-width:55%;
}
#bubbleText {
  position:absolute;bottom:115px;left:50%;transform:translateX(-50%);
  z-index:15;max-width:min(90%,650px);min-width:190px;
  padding:12px 20px;border-radius:24px;
  background:#fffffff0;text-align:center;
  font-size:17px;line-height:1.6;
  box-shadow:0 4px 15px #0002;pointer-events:none
}
#bubbleBar {
  position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:30;
  display:flex;gap:12px;align-items:center;
  background:#ffffff88;backdrop-filter:blur(15px);
  padding:8px 14px;border-radius:42px;
  box-shadow:0 5px 20px #0002
}
.bubbleItem {display:flex;flex-direction:column;align-items:center;gap:4px}
.bubble {
  width:54px;height:54px;border-radius:50%;
  border:2px solid #ffffffd9;font-size:24px;
  box-shadow:0 3px 9px #0002;
  transition:transform .15s
}
.bubble:active {transform:scale(.93)}
.bubbleItem span {font-size:12px;font-weight:800}
#photoBtn {background:var(--pink)}
#talkBtn {background:var(--blue)}
#soundBtn {background:var(--mint)}
#moreBtn {background:var(--cream)}
.recording {animation:pulse 1.1s infinite;background:#ffb8c5!important}
@keyframes pulse {
  0% {box-shadow:0 0 0 0 #ff6c8a88}
  75% {box-shadow:0 0 0 12px #ff6c8a00}
  100% {box-shadow:0 0 0 0 #ff6c8a00}
}
#sidebar {
  position:absolute;right:0;top:0;bottom:0;z-index:22;
  width:min(365px,90vw);overflow:auto;
  background:#fffdf9f7;box-shadow:-5px 0 20px #0002;
  padding:75px 20px 125px;transition:transform .25s
}
#sidebar.closed {transform:translateX(105%);pointer-events:none}
.panel {
  padding:15px;margin-bottom:14px;background:#f4f0fa;
  border-radius:18px
}
.panel h3 {margin:0 0 12px;font-size:17px}
.panel button {padding:11px 12px;border-radius:12px;background:#e1eaf8;margin:4px}
textarea {
  width:100%;min-height:85px;resize:vertical;
  border:1px solid #d7d2df;border-radius:13px;padding:12px
}
#chatLog {
  max-height:210px;overflow:auto;background:white;
  border-radius:13px;padding:10px;font-size:14px;line-height:1.6
}
.chat {padding:8px;margin:5px 0;border-radius:11px;background:#e9f1ff}
.chat.ai {background:#fce8ef}
#status {font-size:13px;line-height:1.6;overflow-wrap:anywhere}
#heroList {font-size:14px;line-height:1.8}
.modal {
  position:absolute;inset:0;z-index:100;
  display:flex;justify-content:center;align-items:center;
  padding:15px;background:#1c2632bd
}
.dialog {
  width:min(760px,96vw);max-height:94dvh;overflow:auto;
  background:var(--paper);border-radius:23px;padding:20px
}
.dialog h2 {margin-top:0}
#cameraVideo {
  width:100%;max-height:60dvh;object-fit:contain;
  background:#111;border-radius:14px
}
.actions {display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.actions button {padding:12px 17px;background:var(--mint);border-radius:12px}
#startScreen {
  position:absolute;inset:0;z-index:200;
  background:linear-gradient(145deg,#d8f0e9,#e4e9fa,#fae7e9);
  display:flex;align-items:center;justify-content:center;padding:20px
}
.startCard {
  max-width:520px;text-align:center;background:#fffffff0;
  padding:35px;border-radius:28px;box-shadow:0 15px 40px #0002
}
.startCard h1 {font-size:34px;margin:10px 0}
.startCard button {
  padding:15px 32px;border-radius:25px;
  background:var(--pink);font-size:20px
}
#busyOverlay {
  position:absolute;inset:0;z-index:55;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  background:#ffffff45
}
#busyMessage {
  background:#fffffff0;border-radius:20px;
  padding:18px 24px;font-size:18px;font-weight:700;
  box-shadow:0 5px 18px #0002
}
#app:fullscreen {width:100vw;height:100vh}
@media(max-width:600px) {
  #bubbleBar {gap:7px;padding:8px 10px}
  .bubble {width:50px;height:50px;font-size:22px}
  #bubbleText {font-size:15px;bottom:108px}
  #title {font-size:13px;max-width:48%}
}
@media(prefers-reduced-motion:reduce) {
  .recording {animation:none;outline:3px solid #ed718c}
  #sidebar {transition:none}
}
</style>
</head>
<body>
<div id="app">

  <div id="world">
    <div id="scene"></div>
  </div>

  <div id="title">✨ Plus-Plus｜我的想像世界</div>

  <div id="topbar">
    <button class="topbtn" id="fullscreenBtn" title="全螢幕" aria-label="全螢幕">⛶</button>
    <button class="topbtn" id="panelBtn" title="工作台" aria-label="工作台">☰</button>
  </div>

  <div id="bubbleText" aria-live="polite">歡迎！一起拼出你的想像世界吧。</div>

  <div id="bubbleBar">
    <div class="bubbleItem">
      <button class="bubble" id="photoBtn" aria-label="拍照">📸</button>
      <span>拍照</span>
    </div>
    <div class="bubbleItem">
      <button class="bubble" id="talkBtn" aria-label="開始說話">🎤</button>
      <span id="talkLabel">說話</span>
    </div>
    <div class="bubbleItem">
      <button class="bubble" id="soundBtn" aria-label="語音開關">🔊</button>
      <span>語音</span>
    </div>
    <div class="bubbleItem">
      <button class="bubble" id="moreBtn" aria-label="更多功能">☰</button>
      <span>更多</span>
    </div>
  </div>

  <aside id="sidebar" class="closed">
    <h2>🧩 我的創作工作台</h2>
    <div class="panel">
      <h3>作品管理</h3>
      <div id="heroList">尚未加入作品</div>
      <button id="uploadBtn">🖼 上傳照片</button>
      <button id="deleteBtn">🗑 移除選取角色</button>
      <input id="fileInput" type="file" accept="image/*" hidden>
    </div>
    <div class="panel">
      <h3>和世界說話</h3>
      <div id="chatLog"></div>
      <textarea id="chatInput" placeholder="例如：讓小鳥長出彩虹翅膀，飛過城堡"></textarea>
      <button id="sendBtn">✨ 送出想像</button>
      <button id="stopVoiceBtn">⏹ 停止語音</button>
    </div>
    <div class="panel">
      <h3>系統狀態</h3>
      <div id="status">準備中……</div>
      <button id="testBtn">測試 AI 連線</button>
    </div>
  </aside>

  <div id="cameraModal" class="modal hidden">
    <div class="dialog">
      <h2>📸 拍攝你的 Plus-Plus 作品</h2>
      <video id="cameraVideo" autoplay muted playsinline></video>
      <p id="cameraMessage">請將積木作品放在畫面中央。</p>
      <div class="actions">
        <button id="captureBtn">📸 拍照並創造</button>
        <button id="switchBtn">🔄 切換鏡頭</button>
        <button id="closeCameraBtn">✖ 關閉</button>
      </div>
    </div>
  </div>

  <div id="busyOverlay" class="hidden">
    <div id="busyMessage">✨ 正在創造想像世界……</div>
  </div>

  <div id="startScreen">
    <div class="startCard">
      <div style="font-size:60px">🧩 ✨ 🌈</div>
      <h1>Plus-Plus</h1>
      <h2>我的想像世界</h2>
      <p>動手拼積木、拍張照片、說出想像，讓作品在螢幕裡活起來。</p>
      <button id="startBtn">✨ 開始創作</button>
      <p style="font-size:13px">建議使用 Chrome 或 Edge，並允許相機與麥克風。</p>
    </div>
  </div>

  <iframe id="bridgeFrame" title="AI Bridge"></iframe>
</div>

<script src="./sketch.js"></script>
<script src="./ai-director.js"></script>
</body>
</html>
